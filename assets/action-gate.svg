<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Writes have names and rules</title>
  <desc id="desc">Humans and AI agents use the same named cancelOrder action. The action accepts orderId and reason, and refuses orders that have already shipped. A refusal returns the machine-readable error SHIPPED_ORDER_CANNOT_BE_CANCELLED; an accepted action changes status to cancelled. Both outcomes are first-class results, and every applied or refused attempt is recorded in the audit log. A generic UPDATE or direct mutation path does not exist. Source-system write-back is outside the scope of this diagram.</desc>

  <defs>
    <style>
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
    </style>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5B626B"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#C96A00"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="#FFFFFF"/>

  <!-- Heading -->
  <text x="70" y="67" font-size="31" font-weight="760" letter-spacing="0.2" fill="#20242A">Writes have names and rules</text>
  <text x="70" y="103" font-size="19" font-weight="500" fill="#747B84">Every caller uses the same governed gate. Refusal is a first-class result.</text>

  <!-- The sole write surface. -->
  <rect x="70" y="140" width="1260" height="610" rx="40" fill="#FFFFFF" stroke="#20242A" stroke-width="3"/>
  <text x="100" y="183" font-size="15" font-weight="760" letter-spacing="1.6" fill="#20242A">THE ONLY WRITE PATH</text>
  <line x1="100" y1="201" x2="1300" y2="201" stroke="#D5D9DD" stroke-width="2"/>

  <!-- Callers: identity does not change the contract. -->
  <rect x="100" y="250" width="250" height="245" rx="24" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
  <text x="125" y="282" font-size="14" font-weight="760" letter-spacing="1.5" fill="#747B84">CALLERS</text>
  <text x="125" y="309" font-size="17" font-weight="600" fill="#5B626B">one contract</text>

  <rect x="122" y="331" width="206" height="55" rx="15" fill="#FFFFFF" stroke="#9299A1" stroke-width="2"/>
  <circle cx="151" cy="358" r="12" fill="#F4F5F6" stroke="#5B626B" stroke-width="2"/>
  <circle cx="151" cy="354" r="4" fill="#5B626B"/>
  <path d="M 143 366 C 145 359 157 359 159 366" fill="none" stroke="#5B626B" stroke-width="2" stroke-linecap="round"/>
  <text x="177" y="365" font-size="18" font-weight="700" fill="#20242A">human</text>

  <rect x="122" y="399" width="206" height="55" rx="15" fill="#FFFFFF" stroke="#9299A1" stroke-width="2"/>
  <rect x="139" y="414" width="25" height="25" rx="6" fill="#F4F5F6" stroke="#5B626B" stroke-width="2"/>
  <circle cx="147" cy="426" r="2" fill="#5B626B"/>
  <circle cx="156" cy="426" r="2" fill="#5B626B"/>
  <path d="M 151.5 414 L 151.5 409" fill="none" stroke="#5B626B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="151.5" cy="407" r="2" fill="#5B626B"/>
  <text x="177" y="433" font-size="18" font-weight="700" fill="#20242A">AI agent</text>

  <rect x="122" y="467" width="206" height="28" rx="8" fill="#F4F5F6"/>
  <text x="225" y="487" text-anchor="middle" font-size="14" font-weight="650" fill="#5B626B">same rules · same result types</text>

  <!-- The only inbound connection is the named action contract. -->
  <path d="M 350 373 L 435 373" fill="none" stroke="#5B626B" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <rect x="360" y="342" width="72" height="24" rx="5" fill="#FFFFFF"/>
  <text x="396" y="360" text-anchor="middle" font-size="14" font-style="italic" font-weight="600" fill="#747B84">invoke</text>

  <!-- Named action and its executable rule. -->
  <rect x="435" y="225" width="420" height="325" rx="25" fill="#FFFFFF" stroke="#C96A00" stroke-width="3"/>
  <path d="M 460 226 H 830 A 24 24 0 0 1 854 250 V 302 H 436 V 250 A 24 24 0 0 1 460 226 Z" fill="#FFF1DE"/>
  <line x1="436" y1="302" x2="854" y2="302" stroke="#E8B77E" stroke-width="2"/>
  <text x="461" y="255" font-size="14" font-weight="760" letter-spacing="1.5" fill="#C96A00">NAMED ACTION</text>
  <text x="461" y="286" class="code" font-size="28" font-weight="700" fill="#20242A">cancelOrder</text>

  <text x="461" y="333" font-size="13" font-weight="760" letter-spacing="1.4" fill="#747B84">PARAMETERS</text>
  <rect x="461" y="347" width="174" height="45" rx="12" fill="#F8F9FA" stroke="#9299A1" stroke-width="1.8"/>
  <text x="548" y="375" text-anchor="middle" class="code" font-size="18" font-weight="650" fill="#20242A">orderId</text>
  <rect x="649" y="347" width="180" height="45" rx="12" fill="#F8F9FA" stroke="#9299A1" stroke-width="1.8"/>
  <text x="739" y="375" text-anchor="middle" class="code" font-size="18" font-weight="650" fill="#20242A">reason</text>

  <text x="461" y="426" font-size="13" font-weight="760" letter-spacing="1.4" fill="#747B84">PRECONDITION</text>
  <rect x="461" y="440" width="368" height="84" rx="16" fill="#FFF9F1" stroke="#C96A00" stroke-width="2"/>
  <text x="481" y="474" class="code" font-size="17" font-weight="650" fill="#20242A">order.status = shipped</text>
  <text x="481" y="504" font-size="17" font-weight="700" fill="#C96A00">→ refuse the request</text>

  <!-- Rule evaluation has two equally modeled result types. -->
  <path d="M 855 360 L 895 360 C 916 360 916 300 955 300" fill="none" stroke="#C96A00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M 855 360 L 895 360 C 916 360 916 475 955 475" fill="none" stroke="#5B626B" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <rect x="864" y="327" width="89" height="25" rx="5" fill="#FFFFFF"/>
  <text x="909" y="345" text-anchor="middle" font-size="14" font-style="italic" font-weight="600" fill="#747B84">evaluate</text>

  <!-- Refusal is returned as structured, recoverable data. -->
  <rect x="955" y="225" width="345" height="150" rx="22" fill="#FFF1DE" stroke="#C96A00" stroke-width="2.5"/>
  <text x="978" y="253" font-size="13" font-weight="760" letter-spacing="1.4" fill="#C96A00">RESULT</text>
  <text x="978" y="284" font-size="23" font-weight="760" fill="#20242A">REFUSED</text>
  <rect x="1177" y="239" width="101" height="26" rx="8" fill="#C96A00"/>
  <text x="1227.5" y="257" text-anchor="middle" font-size="11.5" font-weight="760" letter-spacing="0.7" fill="#FFFFFF">FIRST-CLASS</text>
  <rect x="977" y="300" width="301" height="27" rx="6" fill="#FFFFFF"/>
  <text x="1127.5" y="319" text-anchor="middle" class="code" font-size="12.4" font-weight="650" fill="#20242A">SHIPPED_ORDER_CANNOT_BE_CANCELLED</text>
  <text x="978" y="350" font-size="15" font-weight="600" fill="#5B626B">structured return · caller can recover</text>

  <!-- Accepted actions return an applied state transition. -->
  <rect x="955" y="400" width="345" height="150" rx="22" fill="#F4F5F6" stroke="#5B626B" stroke-width="2.5"/>
  <text x="978" y="428" font-size="13" font-weight="760" letter-spacing="1.4" fill="#747B84">RESULT</text>
  <text x="978" y="459" font-size="23" font-weight="760" fill="#20242A">APPLIED</text>
  <rect x="1177" y="414" width="101" height="26" rx="8" fill="#5B626B"/>
  <text x="1227.5" y="432" text-anchor="middle" font-size="11.5" font-weight="760" letter-spacing="0.7" fill="#FFFFFF">FIRST-CLASS</text>
  <rect x="977" y="475" width="301" height="30" rx="6" fill="#FFFFFF"/>
  <text x="1127.5" y="496" text-anchor="middle" class="code" font-size="17" font-weight="650" fill="#20242A">status → cancelled</text>
  <text x="978" y="529" font-size="15" font-weight="600" fill="#5B626B">state transition returned</text>

  <!-- Every result is auditable; neither branch is exceptional. -->
  <path d="M 1300 300 L 1315 300 C 1325 300 1325 310 1325 320 L 1325 575 C 1325 590 1315 600 1300 600" fill="none" stroke="#C96A00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M 1128 550 L 1128 600" fill="none" stroke="#5B626B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"/>

  <rect x="435" y="600" width="865" height="105" rx="21" fill="#F8F9FA" stroke="#5B626B" stroke-width="2.5"/>
  <line x1="461" y1="620" x2="461" y2="684" stroke="#C96A00" stroke-width="5" stroke-linecap="round"/>
  <text x="483" y="635" font-size="14" font-weight="760" letter-spacing="1.5" fill="#747B84">AUDIT LOG</text>
  <text x="483" y="668" font-size="21" font-weight="700" fill="#20242A">one record for every attempt</text>
  <text x="483" y="692" font-size="15" font-weight="600" fill="#5B626B">applied or refused</text>

  <rect x="1017" y="631" width="119" height="39" rx="11" fill="#FFF1DE" stroke="#C96A00" stroke-width="2"/>
  <text x="1076.5" y="656" text-anchor="middle" font-size="13" font-weight="760" letter-spacing="0.8" fill="#C96A00">REFUSED</text>
  <rect x="1150" y="631" width="119" height="39" rx="11" fill="#FFFFFF" stroke="#5B626B" stroke-width="2"/>
  <text x="1209.5" y="656" text-anchor="middle" font-size="13" font-weight="760" letter-spacing="0.8" fill="#20242A">APPLIED</text>
  <text x="1143" y="691" text-anchor="middle" font-size="14" font-style="italic" font-weight="600" fill="#747B84">both are recorded</text>

  <!-- No disabled bypass is shown: the generic route is absent from the interface. -->
  <rect x="70" y="780" width="1260" height="135" rx="24" fill="#FFFFFF" stroke="#9299A1" stroke-width="2.5" stroke-dasharray="10 10"/>
  <text x="100" y="814" font-size="14" font-weight="760" letter-spacing="1.5" fill="#747B84">ABSENT BY DESIGN</text>
  <rect x="100" y="832" width="430" height="55" rx="14" fill="#F8F9FA" stroke="#9299A1" stroke-width="2"/>
  <text x="315" y="866" text-anchor="middle" class="code" font-size="18" font-weight="600" fill="#5B626B">generic UPDATE / direct mutation</text>

  <text x="620" y="852" font-size="23" font-weight="760" fill="#20242A">No path exists</text>
  <text x="620" y="881" font-size="17" font-weight="500" fill="#747B84">not blocked — absent from the write interface</text>
  <text x="1300" y="865" text-anchor="end" font-size="15" font-style="italic" font-weight="600" fill="#9299A1">no connector · no bypass</text>

  <text x="1330" y="953" text-anchor="end" font-size="16" font-weight="500" fill="#747B84">Operational Ontology · action gate</text>
</svg>
