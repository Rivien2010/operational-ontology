<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Every Order state declares one authority</title>
  <desc id="desc">An authority map for an Order object. Status and total are source-backed by the upstream order system and use a governed write-back path. Assignee and Note are ontology-owned, making the ontology datastore their single source of truth. Aggregates and counts are derived, computed only, and never written. State with no declared owner is forbidden. A re-index restores each state according to its declared authority.</desc>

  <defs>
    <style>
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
    </style>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5B626B"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#C96A00"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#FFFFFF"/>

  <!-- Heading -->
  <text x="54" y="69" font-size="29" font-weight="760" letter-spacing="0.2" fill="#20242A">Every Order state declares one authority</text>
  <text x="54" y="102" font-size="19" font-weight="500" fill="#747B84">The declaration determines its Single Source of Truth (SSoT) and write behavior.</text>

  <!-- Order object: each row is a state-level authority declaration. -->
  <rect x="54" y="146" width="1092" height="444" rx="30" fill="#FFFFFF" stroke="#20242A" stroke-width="3"/>
  <text x="84" y="190" font-size="17" font-weight="760" letter-spacing="1.4" fill="#20242A">ORDER OBJECT</text>
  <text x="331" y="190" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.1" fill="#747B84">DECLARED AUTHORITY</text>
  <text x="760" y="190" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.1" fill="#747B84">OWNER / WRITE RULE</text>
  <line x1="76" y1="207" x2="1124" y2="207" stroke="#D5D9DD" stroke-width="2"/>

  <!-- source-backed lane -->
  <rect x="76" y="226" width="214" height="92" rx="20" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
  <text x="98" y="256" font-size="15" font-weight="700" letter-spacing="1" fill="#747B84">ORDER STATE</text>
  <rect x="98" y="270" width="78" height="31" rx="7" fill="#FFFFFF" stroke="#9299A1" stroke-width="1.8"/>
  <text x="137" y="291" text-anchor="middle" font-size="17" font-weight="650" fill="#20242A">status</text>
  <rect x="184" y="270" width="78" height="31" rx="7" fill="#FFFFFF" stroke="#9299A1" stroke-width="1.8"/>
  <text x="223" y="291" text-anchor="middle" font-size="17" font-weight="650" fill="#20242A">total</text>

  <line x1="290" y1="272" x2="342" y2="272" stroke="#5B626B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <rect x="352" y="241" width="204" height="62" rx="18" fill="#F4F5F6" stroke="#5B626B" stroke-width="2.5"/>
  <text x="454" y="279" text-anchor="middle" font-size="20" font-weight="750" fill="#20242A">source-backed</text>

  <line x1="556" y1="272" x2="608" y2="272" stroke="#5B626B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <rect x="618" y="226" width="506" height="92" rx="20" fill="#F4F5F6" stroke="#5B626B" stroke-width="2.5"/>
  <text x="642" y="256" font-size="19" font-weight="700" fill="#20242A">upstream order system</text>
  <text x="642" y="285" font-size="17" font-weight="500" fill="#5B626B">SSoT · re-indexed from source</text>
  <rect x="932" y="239" width="166" height="53" rx="14" fill="#FFF1DE" stroke="#C96A00" stroke-width="2.5"/>
  <text x="1015" y="271" text-anchor="middle" font-size="15" font-weight="750" fill="#20242A">rules · audit</text>
  <path d="M 932 281 C 891 310 833 310 790 287" fill="none" stroke="#C96A00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="810" y="298" width="105" height="24" rx="5" fill="#FFFFFF"/>
  <text x="863" y="316" text-anchor="middle" font-size="16" font-weight="750" fill="#C96A00">write-back</text>

  <!-- ontology-owned lane -->
  <rect x="76" y="341" width="214" height="106" rx="20" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
  <text x="98" y="371" font-size="15" font-weight="700" letter-spacing="1" fill="#747B84">ORDER STATE</text>
  <rect x="98" y="385" width="96" height="31" rx="7" fill="#FFFFFF" stroke="#9299A1" stroke-width="1.8"/>
  <text x="146" y="406" text-anchor="middle" font-size="17" font-weight="650" fill="#20242A">assignee</text>
  <rect x="202" y="385" width="60" height="31" rx="7" fill="#FFFFFF" stroke="#9299A1" stroke-width="1.8"/>
  <text x="232" y="406" text-anchor="middle" font-size="17" font-weight="650" fill="#20242A">Note</text>

  <line x1="290" y1="394" x2="342" y2="394" stroke="#5B626B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <rect x="352" y="363" width="204" height="62" rx="18" fill="#F4F5F6" stroke="#5B626B" stroke-width="2.5"/>
  <text x="454" y="401" text-anchor="middle" font-size="20" font-weight="750" fill="#20242A">ontology-owned</text>

  <line x1="556" y1="394" x2="608" y2="394" stroke="#5B626B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <rect x="618" y="341" width="506" height="106" rx="20" fill="#F4F5F6" stroke="#5B626B" stroke-width="2.5"/>
  <text x="642" y="379" font-size="19" font-weight="700" fill="#20242A">ontology datastore</text>
  <text x="642" y="408" font-size="17" font-weight="500" fill="#5B626B">SSoT · preserved across re-index</text>
  <text x="642" y="432" font-size="13" font-style="italic" font-weight="500" fill="#747B84">Note: triage memo · no source column</text>
  <rect x="927" y="364" width="171" height="58" rx="14" fill="#FFFFFF" stroke="#9299A1" stroke-width="2"/>
  <text x="1013" y="389" text-anchor="middle" font-size="15" font-weight="700" fill="#20242A">direct state</text>
  <text x="1013" y="410" text-anchor="middle" font-size="15" font-weight="600" fill="#5B626B">persistence</text>

  <!-- derived lane -->
  <rect x="76" y="470" width="214" height="92" rx="20" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
  <text x="98" y="500" font-size="15" font-weight="700" letter-spacing="1" fill="#747B84">ORDER STATE</text>
  <rect x="98" y="514" width="92" height="31" rx="7" fill="#FFFFFF" stroke="#9299A1" stroke-width="1.8"/>
  <text x="144" y="535" text-anchor="middle" font-size="16" font-weight="650" fill="#20242A">aggregate</text>
  <rect x="198" y="514" width="64" height="31" rx="7" fill="#FFFFFF" stroke="#9299A1" stroke-width="1.8"/>
  <text x="230" y="535" text-anchor="middle" font-size="16" font-weight="650" fill="#20242A">count</text>

  <line x1="290" y1="516" x2="342" y2="516" stroke="#5B626B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <rect x="352" y="485" width="204" height="62" rx="18" fill="#F4F5F6" stroke="#5B626B" stroke-width="2.5"/>
  <text x="454" y="523" text-anchor="middle" font-size="20" font-weight="750" fill="#20242A">derived</text>

  <line x1="556" y1="516" x2="608" y2="516" stroke="#5B626B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <rect x="618" y="470" width="506" height="92" rx="20" fill="#F4F5F6" stroke="#5B626B" stroke-width="2.5"/>
  <text x="642" y="508" font-size="19" font-weight="700" fill="#20242A">computed from declared state</text>
  <text x="642" y="537" font-size="17" font-weight="500" fill="#5B626B">recomputed · never written</text>

  <!-- Re-index contract -->
  <rect x="54" y="616" width="792" height="90" rx="20" fill="#F8F9FA" stroke="#5B626B" stroke-width="2.5"/>
  <text x="80" y="649" font-size="15" font-weight="760" letter-spacing="1.2" fill="#747B84">RE-INDEX CONTRACT</text>
  <text x="80" y="681" font-size="18" font-weight="650" fill="#20242A">reload from source</text>
  <text x="263" y="681" font-size="18" font-weight="500" fill="#9299A1">·</text>
  <text x="284" y="681" font-size="18" font-weight="650" fill="#20242A">preserve ontology state</text>
  <text x="495" y="681" font-size="18" font-weight="500" fill="#9299A1">·</text>
  <text x="516" y="681" font-size="18" font-weight="650" fill="#20242A">recompute derived state</text>

  <!-- Explicitly forbidden unowned state -->
  <rect x="870" y="616" width="276" height="90" rx="20" fill="#FFFFFF" stroke="#5B626B" stroke-width="2.5" stroke-dasharray="9 8"/>
  <circle cx="907" cy="661" r="19" fill="#F4F5F6" stroke="#5B626B" stroke-width="2.5"/>
  <path d="M 896 650 L 918 672 M 918 650 L 896 672" fill="none" stroke="#20242A" stroke-width="3" stroke-linecap="round"/>
  <text x="940" y="651" font-size="15" font-weight="760" letter-spacing="1" fill="#747B84">FORBIDDEN</text>
  <text x="940" y="678" font-size="17" font-weight="700" fill="#20242A">no declared owner</text>

  <text x="1146" y="739" text-anchor="end" font-size="16" font-weight="500" fill="#747B84">Operational Ontology · authority map</text>
</svg>
