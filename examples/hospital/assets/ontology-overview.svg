<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc">
  <title id="title">Hospital: evaluate candidates, record a plan</title>
  <desc id="desc">Hospital schema with all six object types and seven declared links. Hospital links to Patient, Bed and Nurse; Patient links to Admission. Patient, Bed and Nurse link to ontology-owned Allocation. bedSearch and nurseSearch calculate candidates without creating links. allocate rechecks eligibility and creates Allocation and its three links. Selected properties only.</desc>
  <!-- Edit this SVG, then export its PNG at 2x with:
       rsvg-convert -w 2400 -o ontology-overview.png ontology-overview.svg -->
  <defs>
    <style>text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }</style>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5B626B"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C96A00"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="1230" rx="0" fill="#FFFFFF"/>
  <text x="54" y="65" text-anchor="start" font-size="29" font-weight="760" fill="#20242A">Hospital: evaluate candidates, record a plan</text>
  <text x="54" y="101" text-anchor="start" font-size="19" font-weight="500" fill="#747B84">6 object types · 7 link types · 2 Functions · 1 Action</text>
  <rect x="54" y="140" width="1092" height="630" rx="30" fill="#FFFFFF" stroke="#20242A" stroke-width="3"/>
  <text x="84" y="183" text-anchor="start" font-size="17" font-weight="760" fill="#20242A" letter-spacing="1.2">OBJECT TYPES &amp; LINKS</text>
  <text x="1116" y="183" text-anchor="end" font-size="16" font-weight="500" fill="#747B84">Selected properties · primary key: id</text>
  <!-- Schema arrows are declared from → to; they are not an exploration sequence. -->
  <g data-link="hospitalPatients" data-from="Hospital" data-to="Patient" data-kind="one-to-many">
  <path d="M 328 282 H 488" fill="none" stroke="#5B626B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <text x="408" y="265" text-anchor="middle" font-size="15.5" font-weight="650" fill="#5B626B">hospitalPatients</text>
  <text x="408" y="309" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>
  <g data-link="patientAdmission" data-from="Patient" data-to="Admission" data-kind="one-to-many">
  <path d="M 722 282 H 882" fill="none" stroke="#5B626B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <text x="802" y="265" text-anchor="middle" font-size="15.5" font-weight="650" fill="#5B626B">patientAdmission</text>
  <text x="802" y="309" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>
  <g data-link="hospitalBeds" data-from="Hospital" data-to="Bed" data-kind="one-to-many">
  <path d="M 183 335 V 530" fill="none" stroke="#5B626B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <rect x="100.0" y="418" width="162" height="54" rx="6" fill="#FFFFFF"/>
  <text x="181" y="440" text-anchor="middle" font-size="17" font-weight="650" fill="#5B626B">hospitalBeds</text>
  <text x="181" y="464" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>
  <g data-link="hospitalNurses" data-from="Hospital" data-to="Nurse" data-kind="one-to-many">
  <path d="M 300 335 V 392 H 593 V 530" fill="none" stroke="#5B626B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <text x="447" y="376" text-anchor="middle" font-size="17" font-weight="650" fill="#5B626B">hospitalNurses</text>
  <text x="447" y="420" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>
  <g data-link="patientAllocations" data-from="Patient" data-to="Allocation" data-kind="one-to-many">
  <path d="M 666 335 V 455 H 999 V 530" fill="none" stroke="#C96A00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <text x="822" y="436" text-anchor="middle" font-size="15.5" font-weight="650" fill="#C96A00">patientAllocations</text>
  <text x="822" y="480" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>
  <g data-link="bedAllocations" data-from="Bed" data-to="Allocation" data-kind="one-to-many">
  <path d="M 211 635 V 676 H 999 V 635" fill="none" stroke="#C96A00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <text x="603" y="659" text-anchor="middle" font-size="17" font-weight="650" fill="#C96A00">bedAllocations</text>
  <text x="603" y="703" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>
  <g data-link="nurseAllocations" data-from="Nurse" data-to="Allocation" data-kind="one-to-many">
  <path d="M 722 582 H 882" fill="none" stroke="#C96A00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <text x="802" y="563" text-anchor="middle" font-size="15.5" font-weight="650" fill="#C96A00">nurseAllocations</text>
  <text x="802" y="607" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>
  <g data-object="Hospital" data-properties="name">
  <rect x="94" y="230" width="234" height="105" rx="21" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
  <text x="114" y="265" text-anchor="start" font-size="23" font-weight="730" fill="#20242A">Hospital</text>
  <text x="114" y="294" text-anchor="start" font-size="17" font-weight="500" fill="#5B626B">name</text>
  </g>
  <g data-object="Patient" data-properties="status requiredEquipment">
  <rect x="488" y="230" width="234" height="105" rx="21" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
  <text x="508" y="265" text-anchor="start" font-size="23" font-weight="730" fill="#20242A">Patient</text>
  <text x="508" y="294" text-anchor="start" font-size="17" font-weight="500" fill="#5B626B">status</text>
  <text x="508" y="318" text-anchor="start" font-size="17" font-weight="500" fill="#5B626B">requiredEquipment</text>
  </g>
  <g data-object="Admission" data-properties="confirmation">
  <rect x="882" y="230" width="234" height="105" rx="21" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
  <text x="902" y="265" text-anchor="start" font-size="23" font-weight="730" fill="#20242A">Admission</text>
  <text x="902" y="294" text-anchor="start" font-size="17" font-weight="500" fill="#5B626B">confirmation</text>
  </g>
  <g data-object="Bed" data-properties="status equipment area reserved">
  <rect x="94" y="530" width="234" height="105" rx="21" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
  <text x="114" y="565" text-anchor="start" font-size="23" font-weight="730" fill="#20242A">Bed</text>
  <text x="114" y="594" text-anchor="start" font-size="17" font-weight="500" fill="#5B626B">status · equipment</text>
  <text x="114" y="618" text-anchor="start" font-size="17" font-weight="500" fill="#5B626B">area · reserved</text>
  </g>
  <g data-object="Nurse" data-properties="shift area slots">
  <rect x="488" y="530" width="234" height="105" rx="21" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
  <text x="508" y="565" text-anchor="start" font-size="23" font-weight="730" fill="#20242A">Nurse</text>
  <text x="508" y="594" text-anchor="start" font-size="17" font-weight="500" fill="#5B626B">shift · area · slots</text>
  </g>
  <g data-object="Allocation" data-properties="note">
  <rect x="882" y="530" width="234" height="105" rx="21" fill="#FFF1DE" stroke="#C96A00" stroke-width="2.5"/>
  <text x="902" y="565" text-anchor="start" font-size="23" font-weight="730" fill="#20242A">Allocation</text>
  <text x="902" y="594" text-anchor="start" font-size="17" font-weight="500" fill="#5B626B">note</text>
  </g>
  <!-- Ownership colors match the main README authority map. -->
  <path d="M 84 720 H 120" stroke="#5B626B" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="133" y="725" text-anchor="start" font-size="17" font-weight="600" fill="#5B626B">source-backed</text>
  <path d="M 320 720 H 356" stroke="#C96A00" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="369" y="725" text-anchor="start" font-size="17" font-weight="600" fill="#C96A00">ontology-owned</text>
  <text x="655" y="725" text-anchor="start" font-size="17" font-weight="500" fill="#5B626B">Arrows show declared from → to.</text>
  <text x="84" y="751" text-anchor="start" font-size="16" font-weight="500" fill="#747B84">1:N = one-to-many · M:N = many-to-many</text>
  <text x="655" y="751" text-anchor="start" font-size="16" font-weight="500" fill="#747B84">Pivot can follow either end of a link.</text>
  <text x="54" y="812" text-anchor="start" font-size="17" font-weight="760" fill="#20242A" letter-spacing="1.2">MODEL OPERATIONS</text>
  <rect x="54" y="835" width="530" height="314" rx="24" fill="#F8F9FA" stroke="#5B626B" stroke-width="2.5"/>
  <rect x="610" y="835" width="536" height="314" rx="24" fill="#FFF1DE" stroke="#C96A00" stroke-width="2.5"/>
  <text x="80" y="872" text-anchor="start" font-size="16" font-weight="750" fill="#5B626B" letter-spacing="1">FUNCTION · READ ONLY</text>
  <path d="M 644 853 L 656 866 L 644 879 L 632 866 Z" fill="#FFFFFF" stroke="#C96A00" stroke-width="2"/>
  <text x="670" y="872" text-anchor="start" font-size="16" font-weight="750" fill="#C96A00" letter-spacing="1">ACTION · RULES &amp; AUDIT</text>
  <g data-function="bedSearch">
  <text x="80" y="912" text-anchor="start" font-size="23" font-weight="730" fill="#20242A">bedSearch</text>
  <text x="80" y="946" text-anchor="start" font-size="18" font-weight="500" fill="#5B626B">patientId → Bed set + assessments</text>
  <text x="80" y="980" text-anchor="start" font-size="18" font-weight="500" fill="#5B626B">Readiness · equipment · reservations</text>
  </g>
  <line x1="80" y1="996" x2="558" y2="996" stroke="#D5D9DD" stroke-width="1.5"/>
  <g data-function="nurseSearch">
  <text x="80" y="1026" text-anchor="start" font-size="23" font-weight="730" fill="#20242A">nurseSearch</text>
  <text x="80" y="1060" text-anchor="start" font-size="18" font-weight="500" fill="#5B626B">patientId + bedId → Nurse set + assessments</text>
  <text x="80" y="1094" text-anchor="start" font-size="18" font-weight="500" fill="#5B626B">Day shift · area · remaining slots</text>
  </g>
  <text x="80" y="1122" text-anchor="start" font-size="17" font-weight="550" fill="#5B626B">Candidate computation creates no links.</text>
  <g data-action="allocate">
  <text x="636" y="916" text-anchor="start" font-size="23" font-weight="730" fill="#20242A">allocate</text>
  <text x="636" y="954" text-anchor="start" font-size="18" font-weight="500" fill="#5B626B">Patient + selected Bed + selected Nurse</text>
  <text x="636" y="988" text-anchor="start" font-size="18" font-weight="500" fill="#5B626B">Recheck the same eligibility rules.</text>
  <text x="636" y="1022" text-anchor="start" font-size="18" font-weight="500" fill="#5B626B">Create Allocation + 3 owned links.</text>
  <text x="636" y="1056" text-anchor="start" font-size="18" font-weight="500" fill="#5B626B">Later searches account for existing plans.</text>
  <text x="636" y="1122" text-anchor="start" font-size="17" font-weight="650" fill="#C96A00">Provisional plan; source state stays intact.</text>
  </g>
  <text x="600" y="1183" text-anchor="middle" font-size="18" font-weight="550" fill="#5B626B">Explore → evaluate candidates → choose bed + nurse → run the Action</text>
  <text x="1146" y="1214" text-anchor="end" font-size="16" font-weight="500" fill="#747B84">Operational Ontology · hospital example</text>
</svg>
